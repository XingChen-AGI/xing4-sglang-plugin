[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-xing4-0-plugin"
version = "0.1.0"
description = "Out-of-tree XingChen Xing4_0 (Xing4.0-29B-A4B) support for SGLang"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Deliberately no dependency on sglang: install into an existing sglang
# environment (see TESTED_SGLANG in src/sglang_xing4_0_plugin/__init__.py).

[project.entry-points."sglang.srt.plugins"]
xing4_0 = "sglang_xing4_0_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sglang_xing4_0_plugin*"]
